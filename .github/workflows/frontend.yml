name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  VITE_STELLAR_NETWORK: testnet
  VITE_HORIZON_URL: https://horizon-testnet.stellar.org
  VITE_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
      
      - name: Run tests
        working-directory: frontend
        run: npm run test:run
      
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_RECORD_REGISTRY_CONTRACT_ID: ${{ secrets.VITE_RECORD_REGISTRY_CONTRACT_ID }}
          VITE_ACCESS_CONTROL_CONTRACT_ID: ${{ secrets.VITE_ACCESS_CONTROL_CONTRACT_ID }}
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}
      
      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html && echo "✓ index.html found"
          test -d frontend/dist/assets && echo "✓ assets directory found"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          production: true
