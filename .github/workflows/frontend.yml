name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  VITE_STELLAR_NETWORK: testnet
  VITE_HORIZON_URL: https://horizon-testnet.stellar.org
  VITE_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
      
      - name: Run tests
        working-directory: frontend
        run: npm run test:run
      
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_RECORD_REGISTRY_CONTRACT_ID: ${{ secrets.VITE_RECORD_REGISTRY_CONTRACT_ID }}
          VITE_ACCESS_CONTROL_CONTRACT_ID: ${{ secrets.VITE_ACCESS_CONTROL_CONTRACT_ID }}
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}
      
      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html && echo "✓ index.html found"
          test -d frontend/dist/assets && echo "✓ assets directory found"
          ls -lh frontend/dist/assets/ | head -5
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5
          compression-level: 6

  cd:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build for production
        working-directory: frontend
        run: npm run build
        env:
          VITE_RECORD_REGISTRY_CONTRACT_ID: ${{ secrets.VITE_RECORD_REGISTRY_CONTRACT_ID }}
          VITE_ACCESS_CONTROL_CONTRACT_ID: ${{ secrets.VITE_ACCESS_CONTROL_CONTRACT_ID }}
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}
      
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --confirm
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_RECORD_REGISTRY_CONTRACT_ID: ${{ secrets.VITE_RECORD_REGISTRY_CONTRACT_ID }}
          VITE_ACCESS_CONTROL_CONTRACT_ID: ${{ secrets.VITE_ACCESS_CONTROL_CONTRACT_ID }}
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}
      
      - name: Deployment summary
        if: success()
        run: |
          echo "✓ Frontend successfully deployed to Vercel"
          echo "✓ Visit: https://care-vault-q6sd.vercel.app"
      
      - name: Deployment failed
        if: failure()
        run: |
          echo "✗ Vercel deployment failed"
          echo "Check VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets"
          exit 1

